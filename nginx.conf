daemon off; 

error_log /dev/stdout warn;
pid /dev/null; 

events {
    worker_connections 1024;
}

http {
    log_format proxy_log '$remote_addr - $remote_user [$time_local] "$request" '
                         'status:$status bytes:$body_bytes_sent '
                         'to_upstream:"$upstream_addr"';
    access_log /dev/stdout proxy_log;

    lua_shared_dict app 1m;

    lua_package_path "lua/?.lua;;";

    upstream svc-users-backend {
        server 127.0.0.1:8088; 
        keepalive 8; 
    }
    upstream svc-auth-backend {
        server 127.0.0.1:8088; 
        keepalive 8; 
    }
    upstream svc-dox-backend {
        server 127.0.0.1:8088; 
        keepalive 8; 
    }
    upstream svc-queue-backend {
        server 127.0.0.1:8088; 
        keepalive 8; 
    }

    init_by_lua_file "lua/init_app.lua";
    lua_code_cache on;
    server {
        listen 127.0.0.1:8080;
        server_name localhost;

        location / {
            set $backend "";
            access_by_lua_file "lua/my_endpoint.lua";

            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /minecraft-servers/ {
            autoindex on;
            charset utf-8;
            root ./minecraft-servers/;
            client_max_body_size 10m;
            client_body_buffer_size 10m;
            if ($request_method ~ ^(GET|HEAD)$) {
                try_files $uri $uri/ =404;
            }
            if ($request_method ~ ^(POST|PUT|OPTIONS)$) {
                access_by_lua_file "lua/passthrough_auth.lua";
                content_by_lua_file "lua/minecraft-servers.lua";
            }
            return 405;
        }

        location /sys/reload {
            allow 127.0.0.1;
            allow ::1;
            deny all;
            content_by_lua_file "lua/reload.lua";
        }
    }

    server {
        listen 127.0.0.1:8081;
        server_name 127.0.0.1 localhost;

        location = / {
            set $backend "";
            access_by_lua_file "lua/websocket_endpoint.lua";
            content_by_lua_file "lua/websocket.lua";
        }
    }

    server {
        listen 127.0.0.1:8080;
        server_name 127.0.0.1;

        location / {
            set $backend "";
            access_by_lua_file "lua/noauth_endpoint.lua";

            proxy_pass $backend;
            
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /sys/reload {
            allow 127.0.0.1;
            allow ::1;
            deny all;
            content_by_lua_file "lua/reload.lua";
        }
    }
}
